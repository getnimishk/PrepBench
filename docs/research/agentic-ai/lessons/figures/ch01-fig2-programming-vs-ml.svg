<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif">
  <title id="t2">Traditional programming compared with machine learning</title>
  <desc id="d2">Top row: rules and data go into a program, which produces an answer. Bottom: data and expected answers go through training to produce a model. Later, new data goes into the model, which produces a prediction.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e78"/></marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1a1a1a">Traditional programming: you write the rules</text>
  <rect x="24" y="52" width="190" height="64" rx="10" fill="#e6eef8" stroke="#1f4e78" stroke-width="2"/>
  <text x="119" y="90" font-size="16" text-anchor="middle" fill="#1a1a1a">Rules + data</text>
  <line x1="214" y1="84" x2="290" y2="84" stroke="#1f4e78" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="294" y="52" width="160" height="64" rx="10" fill="#e6eef8" stroke="#1f4e78" stroke-width="2"/>
  <text x="374" y="90" font-size="16" text-anchor="middle" fill="#1a1a1a">Program</text>
  <line x1="454" y1="84" x2="530" y2="84" stroke="#1f4e78" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="534" y="52" width="150" height="64" rx="10" fill="#e6eef8" stroke="#1f4e78" stroke-width="2"/>
  <text x="609" y="90" font-size="16" text-anchor="middle" fill="#1a1a1a">Answer</text>
  <line x1="24" y1="146" x2="736" y2="146" stroke="#c9d3e0" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="24" y="182" font-size="18" font-weight="bold" fill="#1a1a1a">Machine learning: the system learns the rules from examples</text>
  <text x="24" y="206" font-size="14" fill="#555555">Step 1, training (done once, then repeated when needed)</text>
  <rect x="24" y="220" width="230" height="64" rx="10" fill="#e6eef8" stroke="#1f4e78" stroke-width="2"/>
  <text x="139" y="258" font-size="16" text-anchor="middle" fill="#1a1a1a">Data + expected answers</text>
  <line x1="254" y1="252" x2="330" y2="252" stroke="#1f4e78" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="334" y="220" width="150" height="64" rx="10" fill="#e6eef8" stroke="#1f4e78" stroke-width="2"/>
  <text x="409" y="258" font-size="16" text-anchor="middle" fill="#1a1a1a">Training</text>
  <line x1="484" y1="252" x2="560" y2="252" stroke="#1f4e78" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="564" y="220" width="150" height="64" rx="10" fill="#fff4d6" stroke="#b36b00" stroke-width="2.5"/>
  <text x="639" y="258" font-size="16" text-anchor="middle" fill="#1a1a1a">Model</text>
  <text x="24" y="326" font-size="14" fill="#555555">Step 2, using it</text>
  <rect x="24" y="340" width="190" height="64" rx="10" fill="#e6eef8" stroke="#1f4e78" stroke-width="2"/>
  <text x="119" y="378" font-size="16" text-anchor="middle" fill="#1a1a1a">New data</text>
  <line x1="214" y1="372" x2="290" y2="372" stroke="#1f4e78" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="294" y="340" width="160" height="64" rx="10" fill="#fff4d6" stroke="#b36b00" stroke-width="2.5"/>
  <text x="374" y="378" font-size="16" text-anchor="middle" fill="#1a1a1a">Model</text>
  <line x1="454" y1="372" x2="530" y2="372" stroke="#1f4e78" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="534" y="340" width="180" height="64" rx="10" fill="#e6eef8" stroke="#1f4e78" stroke-width="2"/>
  <text x="624" y="378" font-size="16" text-anchor="middle" fill="#1a1a1a">Prediction</text>
</svg>
