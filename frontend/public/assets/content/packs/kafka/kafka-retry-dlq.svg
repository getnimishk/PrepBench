<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Failure handling for a payment consumer: poison records go straight to a dead-letter topic; transient failures go through delay topics of 1 minute, 10 minutes and 1 hour, then the dead-letter topic; a circuit breaker stops calls while the payment API is down</title>
  <rect x="0" y="0" width="980" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="70" width="130" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="85" y="94" font-weight="700" fill="#1e1b4b">orders</text><text x="85" y="113" fill="#1e293b">main topic</text>
    <rect x="200" y="70" width="170" height="56" rx="8" fill="#f8fafc" stroke="#334155"/><text x="285" y="94" font-weight="700" fill="#0f172a">payment consumer</text><text x="285" y="113" fill="#1e293b">timeout on every call</text>
    <rect x="420" y="70" width="150" height="56" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="495" y="94" font-weight="700" fill="#78350f">circuit breaker</text><text x="495" y="113" fill="#1e293b">open while API down</text>
    <rect x="620" y="70" width="150" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="695" y="94" font-weight="700" fill="#14532d">payment API</text><text x="695" y="113" fill="#1e293b">idempotency key</text>
    <rect x="820" y="70" width="140" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="890" y="94" font-weight="700" fill="#14532d">success</text><text x="890" y="113" fill="#1e293b">commit offset</text>
  </g>
  <path d="M150 98 L 194 98" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M370 98 L 414 98" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M570 98 L 614 98" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M770 98 L 814 98" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- transient path -->
  <text x="300" y="168" font-size="13" fill="#78350f" font-weight="700">transient failure (timeout, 5xx), or breaker open</text>
  <path d="M285 126 L 285 210" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-size="13" text-anchor="middle">
    <rect x="200" y="214" width="170" height="50" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="285" y="244" fill="#78350f">orders.retry.1m</text>
    <rect x="420" y="214" width="150" height="50" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="495" y="244" fill="#78350f">orders.retry.10m</text>
    <rect x="620" y="214" width="150" height="50" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="695" y="244" fill="#78350f">orders.retry.1h</text>
    <rect x="820" y="214" width="140" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="890" y="238" font-weight="700" fill="#7f1d1d">orders.dlq</text><text x="890" y="255" fill="#7f1d1d">owned, alerted</text>
  </g>
  <path d="M370 239 L 414 239" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M570 239 L 614 239" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M770 239 L 814 239" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="590" y="290" text-anchor="middle" font-size="12" fill="#475569">each level waits its delay, then tries again; still failing moves it on</text>

  <!-- poison path -->
  <path d="M220 126 C 160 180, 160 330, 300 340 L 880 340 L 886 270" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="300" y="326" font-size="13" fill="#7f1d1d" font-weight="700">poison record (cannot parse, fails validation): straight to the dead-letter topic</text>

  <!-- footer -->
  <rect x="20" y="360" width="940" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="490" y="381" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Dead-letter records keep the original key and value, plus the source topic, partition, offset and error as headers.</text>
  <text x="490" y="398" text-anchor="middle" font-size="12" fill="#334155">Records that go through retry topics lose their order relative to later records with the same key.</text>
</svg>
