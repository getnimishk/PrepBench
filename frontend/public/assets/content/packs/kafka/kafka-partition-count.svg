<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Choosing a partition count: too few caps consumer parallelism and broker spread and is costly to grow later; too many adds files, leader elections, replication and metadata; size it from throughput and consumer parallelism, take the larger, add headroom, then check the cluster can carry it</title>
  <rect x="0" y="0" width="980" height="490" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <!-- Too few -->
  <rect x="20" y="20" width="450" height="185" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="245" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Too few partitions</text>
  <g font-size="13" fill="#0f172a">
    <text x="40" y="85">• Consumers beyond the partition count sit idle</text>
    <text x="40" y="115">• Fewer brokers share the topic's load</text>
    <text x="40" y="145">• Growing later moves keys to other partitions,</text>
    <text x="52" y="163">so their order breaks for a while</text>
  </g>

  <!-- Too many -->
  <rect x="510" y="20" width="450" height="185" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="735" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Too many partitions</text>
  <g font-size="13" fill="#0f172a">
    <text x="530" y="85">• A folder of segment files per partition, on every replica</text>
    <text x="530" y="115">• More leaders to elect when a broker fails</text>
    <text x="530" y="145">• More replicas to keep in sync</text>
    <text x="530" y="175">• More entries in the cluster metadata</text>
  </g>

  <!-- Method -->
  <rect x="20" y="220" width="940" height="190" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="490" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">A method, with illustrative numbers</text>

  <g font-size="12">
    <rect x="40" y="265" width="260" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="170" y="285" text-anchor="middle" font-weight="700" fill="#0f172a">Throughput</text>
    <text x="170" y="303" text-anchor="middle" fill="#334155">100 MB/s ÷ 10 MB/s per partition = 10</text>

    <rect x="40" y="325" width="260" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="170" y="345" text-anchor="middle" font-weight="700" fill="#0f172a">Consumer parallelism</text>
    <text x="170" y="363" text-anchor="middle" fill="#334155">20 consumers working at once = 20</text>

    <rect x="345" y="295" width="170" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="430" y="315" text-anchor="middle" font-weight="700" fill="#0f172a">Take the larger</text>
    <text x="430" y="333" text-anchor="middle" fill="#334155">20</text>

    <rect x="560" y="295" width="170" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="645" y="315" text-anchor="middle" font-weight="700" fill="#0f172a">Add headroom (often 2×)</text>
    <text x="645" y="333" text-anchor="middle" fill="#334155">about 40</text>

    <rect x="775" y="295" width="165" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="857" y="315" text-anchor="middle" font-weight="700" fill="#14532d">Check the cluster</text>
    <text x="857" y="333" text-anchor="middle" fill="#14532d">per broker, with replicas</text>
  </g>
  <path d="M300 290 C 322 290, 322 315, 343 318" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M300 350 C 322 350, 322 325, 343 322" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M515 320 L 558 320" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M730 320 L 773 320" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="490" y="396" text-anchor="middle" font-size="12" fill="#475569">The per-partition MB/s comes from your own benchmark: your record size, batching and replication.</text>

  <!-- Footer -->
  <rect x="20" y="425" width="940" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="490" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Partitions can be added but never removed, and adding them moves keys.</text>
  <text x="490" y="466" text-anchor="middle" font-size="13" fill="#334155">There are no fixed ranges in the documentation: the number comes from your workload.</text>
</svg>
