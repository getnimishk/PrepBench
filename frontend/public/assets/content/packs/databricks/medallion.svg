<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The medallion flow: sources land in bronze as they arrived, silver cleans, deduplicates and conforms them, gold builds business aggregates and dimensional models for dashboards and ML</title>
  <rect x="0" y="0" width="980" height="360" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Medallion: data gets more trustworthy at each hop</text>

  <g font-size="13">
    <rect x="20" y="70" width="160" height="220" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Sources</text>
    <text x="40" y="132" fill="#334155">Databases (CDC)</text>
    <text x="40" y="158" fill="#334155">SaaS applications</text>
    <text x="40" y="184" fill="#334155">Files in ADLS</text>
    <text x="40" y="210" fill="#334155">Event streams</text>

    <rect x="215" y="70" width="230" height="220" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="330" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Bronze: as it arrived</text>
    <text x="232" y="132" fill="#78350f">Append-only, raw</text>
    <text x="232" y="158" fill="#78350f">Strings / VARIANT, few checks</text>
    <text x="232" y="184" fill="#78350f">Source file name, load time</text>
    <text x="232" y="210" fill="#78350f">Base for reprocessing, audit</text>
    <text x="232" y="236" fill="#78350f">Not for analysts</text>

    <rect x="480" y="70" width="230" height="220" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="595" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Silver: validated</text>
    <text x="497" y="132" fill="#1e293b">Types cast, nulls handled</text>
    <text x="497" y="158" fill="#1e293b">Deduplicated, conformed</text>
    <text x="497" y="184" fill="#1e293b">Late data handled</text>
    <text x="497" y="210" fill="#1e293b">One row per record version</text>
    <text x="497" y="236" fill="#1e293b">Built from bronze, streaming</text>

    <rect x="745" y="70" width="215" height="220" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="852" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Gold: business-ready</text>
    <text x="762" y="132" fill="#713f12">Aggregates, star schemas</text>
    <text x="762" y="158" fill="#713f12">Materialized views</text>
    <text x="762" y="184" fill="#713f12">Per domain if needed</text>
    <text x="762" y="210" fill="#713f12">Dashboards, ML, apps</text>
  </g>
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <path d="M182 180 L211 180"/><path d="M203 174 L211 180 L203 186"/>
    <path d="M447 180 L476 180"/><path d="M468 174 L476 180 L468 186"/>
    <path d="M712 180 L741 180"/><path d="M733 174 L741 180 L733 186"/>
  </g>
  <text x="490" y="326" text-anchor="middle" font-size="13" fill="#334155">Quality checks (pipeline expectations) sit on each hop; refresh frequency per layer is the cost and latency lever.</text>
</svg>
