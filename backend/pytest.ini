[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto

# Pinning this silences a pytest-asyncio deprecation warning that fires on every
# run, and fixes the behaviour before their default changes under us.
asyncio_default_fixture_loop_scope = function

# `lab`: needs the optional deltalake engine (requirements-lab.txt). The default suite
# skips them; run them with `pytest -m lab` in an environment that has it.
markers =
    lab: needs the optional Lakehouse Lab engine (deltalake)
