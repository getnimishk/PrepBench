name: CI

# There was no CI at all. 340-odd tests existed and nothing ran them but a
# person remembering to, which is how a reset endpoint kept eleven tables for
# months without anyone noticing.

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter the app is actually developed against. The
          # pins moved to 3.14-compatible versions because pydantic-core 2.27.1
          # ships no 3.14 wheel and falls back to a Rust source build.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # The lock, not requirements.txt: it pins transitives too, so a green run
      # here means the same tree that is green locally.
      - name: Install dependencies
        run: pip install -r requirements.lock

      # No .env on a runner, and there should not need to be. GEMINI_API_KEY
      # defaults to None and the tests that need a provider create one; this
      # was verified by running the suite locally with .env moved aside.
      - name: Run tests with coverage
        run: python -m pytest -q --cov --cov-report=term-missing

  frontend:
    name: Frontend (vitest, tsc, eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint and types run before tests: both fail in seconds and catch a whole
      # class of breakage the test suite would take three minutes to reach.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Both halves are needed: the tests drive the real frontend against the real
    # backend. The backend runs against its own throwaway database, which
    # playwright.config.ts deletes before every run, so nothing here can reach a
    # learner's data even if this job were run on a developer's machine.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # playwright.config.ts starts uvicorn from backend/.venv, exactly as a
      # developer's machine has it, so the runner builds the same venv.
      - name: Backend virtualenv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      # The bundled browser. Locally the config uses the installed Chrome
      # instead, because downloading this one through antivirus TLS interception
      # is what breaks; a CI runner has no such problem.
      - name: Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
