name: CI

# There was no CI at all. 340-odd tests existed and nothing ran them but a
# person remembering to, which is how a reset endpoint kept eleven tables for
# months without anyone noticing.

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter the app is actually developed against. The
          # pins moved to 3.14-compatible versions because pydantic-core 2.27.1
          # ships no 3.14 wheel and falls back to a Rust source build.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # The lock, not requirements.txt: it pins transitives too, so a green run
      # here means the same tree that is green locally.
      - name: Install dependencies
        run: pip install -r requirements.lock

      # No .env on a runner, and there should not need to be. GEMINI_API_KEY
      # defaults to None and the tests that need a provider create one; this
      # was verified by running the suite locally with .env moved aside.
      - name: Run tests with coverage
        run: python -m pytest -q --cov --cov-report=term-missing

  frontend:
    name: Frontend (vitest, tsc, eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint and types run before tests: both fail in seconds and catch a whole
      # class of breakage the test suite would take three minutes to reach.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # The Lakehouse Lab engine's own tests. They skip without the optional
  # `deltalake` engine, which the backend job deliberately leaves out (so it
  # keeps proving a clean install starts without it) -- which meant they ran
  # nowhere. Measured with the engine installed: 45 pass; engine.py 91%,
  # operations.py 89% covered.
  lab-engine:
    name: Backend (Lab engine, with deltalake)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-lab.txt

      # The lock first, so the tree matches the backend job's; then the engine.
      - name: Install dependencies with the Lab engine
        run: pip install -r requirements.lock -r requirements-lab.txt

      - name: Run the Lab tests
        run: python -m pytest -q tests/test_lab_*.py

  # The browser suite (Playwright), on pull requests and on main -- not on
  # every push to every branch, since it takes several times longer than the
  # rest. Each worker starts its own backend and frontend (e2e/fixtures.ts),
  # which expects the backend's virtualenv at backend/.venv.
  browser:
    name: Browser (Playwright)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Backend virtualenv
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # CI uses Playwright's bundled Chromium (playwright.config.ts picks the
      # installed Chrome only locally).
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Not the `performance` project: its budgets were measured on the
      # development machine, and a shared runner's speed says nothing about
      # whether a screen has slowed. Run it locally.
      - name: Run the browser suite
        working-directory: frontend
        run: npx playwright test --project=chromium-dev --project=chromium

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
